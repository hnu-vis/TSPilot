[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tspilot-v0-2"
version = "0.1.0"
description = "Backend-first implementation of TSPilot v0.2"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "pydantic>=2.6.0",
  "pydantic-settings>=2.2.0",
  "python-dotenv>=1.0.0",
  "pyyaml>=6.0.1",
  "httpx>=0.27.0",
  "requests>=2.31.0",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "matplotlib>=3.8.0",
  "scipy>=1.12.0",
  "influxdb-client>=1.43.0",
  "langchain-core>=0.1.0",
  "langchain-openai>=0.0.5",
  "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
